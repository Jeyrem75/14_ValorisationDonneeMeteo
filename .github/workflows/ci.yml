name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  # -------------------------
  # 1️⃣ Backend CI
  # -------------------------
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest flake8 bandit

      - name: Run backend tests
        run: |
          pytest backend/weather/tests --junitxml=backend-report.xml

      - name: Run backend linter
        run: |
          flake8 backend --max-line-length=120

      - name: Run backend security scan (Bandit)
        run: |
          bandit -r backend -f json -o backend-bandit.json

      - name: Build Backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meteo-back:latest ./backend

      - name: Run Trivy scan on Backend image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/meteo-back:latest
          format: json
          output: backend-trivy.json

      - name: Upload backend reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend-report.xml
            backend-bandit.json
            backend-trivy.json

  # -------------------------
  # 2️⃣ Frontend CI
  # -------------------------
  ci-frontend:
    runs-on: ubuntu-latest
    needs: ci-backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meteo-front:latest ./frontend

      - name: Run Trivy scan on Frontend image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/meteo-front:latest
          format: json
          output: frontend-trivy.json

      - name: Upload frontend reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend-trivy.json

  # -------------------------
  # 3️⃣ Push Docker images (main branch only)
  # -------------------------
  push-images:
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Backend & Frontend Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/meteo-back:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/meteo-front:latest