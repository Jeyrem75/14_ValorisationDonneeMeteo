name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meteodb
          POSTGRES_USER: infoclimat
          POSTGRES_PASSWORD: infoclimat2026
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_NAME: meteodb
      DB_USER: infoclimat
      DB_PASSWORD: infoclimat2026
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run database migrations
        working-directory: backend
        run: uv run python manage.py migrate

      - name: Run unit tests
        working-directory: backend
        run: |
          uv run pytest weather/tests/unit \
            --junitxml=../backend-test-report.xml \
            -v

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Bandit security scan
        working-directory: backend
        run: |
          uvx bandit -r weather config \
            -f json -o ../backend-bandit.json \
            --exit-zero

      - name: Build backend Docker image
        run: docker build -t meteo-back:ci ./backend

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan backend image
        run: trivy image --format json --output backend-trivy.json --exit-code 0 meteo-back:ci

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend-test-report.xml
            backend-bandit.json
            backend-trivy.json

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:unit || echo "No tests defined"

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend Docker image
        run: docker build -t meteo-front:ci ./frontend

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan frontend image
        run: trivy image --format json --output frontend-trivy.json --exit-code 0 meteo-front:ci

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: frontend-trivy.json

  vex-document:
    name: Upload VEX Document
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload VEX document
        uses: actions/upload-artifact@v4
        with:
          name: vex-document
          path: vex.json

  push-images:
    name: Push Docker Images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/meteo-back:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/meteo-front:latest
