name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  ci-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8 bandit

      - name: Run backend tests
        run: |
          pytest backend/weather/tests --junitxml=backend-report.xml

      - name: Backend linter
        run: |
          flake8 backend --max-line-length=120

      - name: Backend Bandit scan
        run: |
          bandit -r backend -f json -o backend-bandit.json

      - name: Build Backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meteo-back:latest ./backend

      - name: Trivy scan Backend
        uses: aquasecurity/trivy-action@0.33.2
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/meteo-back:latest
          format: json
          output: backend-trivy.json

      - name: Upload backend reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend-report.xml
            backend-bandit.json
            backend-trivy.json

  ci-frontend:
    runs-on: ubuntu-latest
    needs: ci-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test || echo "No tests defined"

      - name: Frontend linter
        run: |
          cd frontend
          npm run lint || echo "No linter defined"

      - name: Build Frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meteo-front:latest ./frontend

      - name: Trivy scan Frontend
        uses: aquasecurity/trivy-action@0.33.2
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/meteo-front:latest
          format: json
          output: frontend-trivy.json

      - name: Upload frontend reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend-trivy.json

  push-images:
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/meteo-back:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/meteo-front:latest