name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  ci-backend:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout repo
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # 2. Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -------------------------
      # 3. Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8 bandit

      # -------------------------
      # 4. Run tests
      # -------------------------
      - name: Run tests
        run: |
          pytest --junitxml=report.xml

      # -------------------------
      # 5. Linter
      # -------------------------
      - name: Run linter
        run: |
          flake8 . --max-line-length=120

      # -------------------------
      # 6. Security scan (code)
      # -------------------------
      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json

      # -------------------------
      # 7. Build Docker image
      # -------------------------
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meteo-app:latest .

      # -------------------------
      # 8. Scan Docker image (Trivy)
      # -------------------------
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/meteo-app:latest
          format: json
          output: trivy-report.json

      # -------------------------
      # 9. Upload reports (artefacts)
      # -------------------------
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            report.xml
            bandit-report.json
            trivy-report.json

  push-docker:
    needs: ci-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/meteo-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/meteo-app:latest